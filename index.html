<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de Conexión Básica</title>
</head>
<body>
    <h2>Auditoría de Enlace de Datos</h2>
    <div id="consola-web" style="background:#000; color:#0f0; padding:15px; font-family:monospace; min-height:200px;">
        Iniciando descarga de datos desde Google...
    </div>

    <script>
        const CSV_URL = "https://google.com";

        async function probarEnlace() {
            const monitor = document.getElementById('consola-web');
            try {
                const response = await fetch(CSV_URL);
                const textoRaw = await response.text();
                
                monitor.innerHTML = "<strong>¡ÉXITO DE TRANSMISIÓN!</strong><br><br>";
                monitor.innerHTML += "Texto crudo recibido desde tu Google Sheets:<br>";
                monitor.innerHTML += "<pre style='color:#fff;'>" + textoRaw + "</pre>";
            } catch (error) {
                monitor.style.color = '#ff0000';
                monitor.innerHTML = "<strong>ERROR DE CONEXIÓN:</strong> " + error.message;
            }
        }
        window.onload = probarEnlace;
    </script>
</body>
</html>
