<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba de Conexión Forzada</title>
    <style>
        body { font-family: sans-serif; padding: 30px; text-align: center; background: #f0f4f8; }
        .box { background: white; padding: 30px; border-radius: 10px; max-width: 400px; margin: 0 auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        input { width: 90%; padding: 10px; margin: 15px 0; border: 1px solid #ccc; border-radius: 5px; font-size: 16px; }
        input[type="submit"] { background: #1d4ed8; color: white; border: none; padding: 12px 20px; font-size: 16px; font-weight: bold; border-radius: 5px; cursor: pointer; width: 95%; }
    </style>
</head>
<body>

    <div class="box">
        <h2>Prueba de Conexión Directa</h2>
        <p>Este método salta los bloqueos de red del navegador.</p>
        
        <!-- El formulario apunta directo a tu nueva URL de Apps Script -->
        <form action="https://script.google.com/macros/s/AKfycbw2Wg1EudZJIimqYKGysWUjbYwWzfhm-e7bsZLFZe5OIYk8qglGTSg3Rv2k3ZrbhJbl/exec" method="POST">
            <input type="text" name="textoPrueba" placeholder="Escribe un mensaje aquí" required>
            <input type="submit" value="Forzar Envío a Google Sheets">
        </form>
    </div>

</body>
</html>
